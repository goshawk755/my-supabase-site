
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книжная полка</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #292820;
    }
    header {
      background: #263d32;
      color: white;
      padding: 28px 7%;
    }
    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #d9e4d9; }
    main { max-width: 1100px; margin: auto; padding: 30px 20px; }
    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #d7d3c9;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .info { color: #68685e; margin-bottom: 20px; }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }
    .book {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 3px 12px #0000000b;
    }
    .cover {
      height: 190px;
      border-radius: 9px;
      background: #e4e8dc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      font-size: 23px;
      color: #344b3b;
      font-weight: bold;
      overflow: hidden;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .book h2 { font-size: 19px; margin: 15px 0 7px; }
    .author { color: #77776d; font-size: 14px; }
    .description { font-size: 14px; line-height: 1.5; }
    button {
      background: #365744;
      color: white;
      border: 0;
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #243e2f; }
    .empty { padding: 30px 0; color: #777; }
    footer { text-align: center; padding: 30px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Книжная полка</h1>
    <p>Найди следующую книгу для своего путешествия</p>
  </header>

  <main>
    <input id="search" class="search"
      placeholder="Поиск по названию или автору..." />
    <div id="info" class="info">Загружаем книги...</div>
    <section id="books" class="books"></section>
  </main>

  <footer>Моя книжная коллекция</footer>

  <script>
    // Настройки Supabase
    const SUPABASE_URL = "https://coimqydotznckkoeyfyg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QkyOKSGkreCyGkYpl7WHwA_m6LabLyE";

    const container = document.getElementById("books");
    const search = document.getElementById("search");
    const info = document.getElementById("info");

    let books = [];

    // Безопасное отображение текста
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getTitle(book) {
      return book.title ?? book.name ?? book.book_title ?? "Без названия";
    }

    function getAuthor(book) {
      return book.author ?? book.authors ?? "Автор не указан";
    }

    function getDescription(book) {
      return book.description ?? book.summary ?? book.content ?? "Описание отсутствует.";
    }

    function render() {
      const query = search.value.trim().toLowerCase();

      const filtered = books.filter(book =>
        String(getTitle(book)).toLowerCase().includes(query) ||
        String(getAuthor(book)).toLowerCase().includes(query)
      );

      info.textContent = `Книг в каталоге: ${filtered.length}`;

      if (!filtered.length) {
        container.innerHTML =
          '<p class="empty">Книги не найдены.</p>';
        return;
      }

      container.innerHTML = filtered.map((book, index) => {
        const title = escapeHTML(getTitle(book));
        const author = escapeHTML(getAuthor(book));
        const description = escapeHTML(getDescription(book));

        return `
          <article class="book">
            <div class="cover">${title}</div>
            <h2>${title}</h2>
            <div class="author">${author}</div>
            <p class="description">${description}</p>
            <button data-index="${index}">Подробнее</button>
          </article>
        `;
      }).join("");

      container.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          const book = filtered[Number(button.dataset.index)];

          alert(
            `${getTitle(book)}\n` +
            `Автор: ${getAuthor(book)}\n\n` +
            `${getDescription(book)}`
          );
        });
      });
    }

    async function loadBooks() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/books?select=*`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          const error = await response.text();
          throw new Error(`Ошибка ${response.status}: ${error}`);
        }

        books = await response.json();
        render();
      } catch (error) {
        console.error("Ошибка Supabase:", error);
        info.textContent = "Не удалось загрузить книги из Supabase.";
        container.innerHTML =
          '<p class="empty">Проверь ключ, название таблицы и права доступа. Подробности есть в консоли браузера (F12).</p>';
      }
    }

    search.addEventListener("input", render);
    loadBooks();
  </script>
</body>
</html>
